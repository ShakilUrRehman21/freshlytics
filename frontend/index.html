<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F5135" />
    <title>Freshlytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='16' rx='15' ry='11' fill='%231F5135'/><path d='M10 18c4-8 10-8 12-8-1 6-5 10-12 8z' fill='%23E9F1DF'/></svg>" />
    <script>
        // Apply the saved theme before first paint to avoid a flash
        try {
            var t = localStorage.getItem('freshlytics_theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (e) { }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
